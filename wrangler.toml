# Configuración del Worker de Cloudflare (plan gratuito).
# Los secretos NO van aquí: se cargan con `npx wrangler secret put NOMBRE`
# (y en local, en el archivo .dev.vars, que está en .gitignore).
name = "brunen-chatbot"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Versión de la Graph API de Meta. Copiar la que aparece en el ejemplo de "API Setup"
# de tu app en developers.facebook.com (formato vNN.N). No adivinarla.
GRAPH_API_VERSION = "v25.0"
BOT_ACTIVO = "SI"
# Flujo de pedido completo (D33): ficha, precio, entrega y pedido guardado en D1 para el panel. Apagado, el bot responde
# en modo prueba. Encendido el 2026-10-30, con las migraciones 0003 y 0004 ya aplicadas en D1 (pasos en docs/ETAPAS.md):
# solo atiende a los números de NUMEROS_PERMITIDOS, los demás se ignoran.
FLUJO_PEDIDO = "SI"
# Espera para juntar los mensajes seguidos de un cliente, en milisegundos (D27; por defecto 7000).
# ESPERA_AGRUPADOR_MS = "7000"
# El registro de cada mensaje en las hojas MENSAJES_PROCESADOS y ERRORES queda apagado (D44): los pedidos y los avisos ya
# están en D1 y se ven en el panel, y cada registro era una llamada más a Google por mensaje. "SI" lo vuelve a encender.
REGISTRO_PLANILLA = "NO"
# Con el número compartido entre el bot y la app WhatsApp Business (coexistencia, D46): minutos que el bot calla con un
# cliente después de que una persona le escribe desde la app (por defecto 60; con 0 el bot no se calla nunca).
# PAUSA_POR_PERSONA_MINUTOS = "60"

# El vigía (src/vigia.ts): cada 5 minutos busca mensajes que quedaron sin atender y, a las 7:30 de Santiago, revisa el
# token de WhatsApp y la planilla. El plan gratis permite 5 tareas programadas por cuenta; esta es la única.
[triggers]
crons = ["*/5 * * * *"]

[observability]
# Workers Logs: los errores del Worker se ven en el panel de Cloudflare sin tener `wrangler tail`
# abierto. Plan gratis: 200.000 eventos de log por día, 3 días de retención.
enabled = true

# Base D1 para deduplicar mensajes por wamid (src/almacen.ts, migrations/, D20).
# Se creó con `npx wrangler d1 create brunen-chatbot`. El database_id no es un secreto.
# Esquema: `npx wrangler d1 migrations apply brunen-chatbot --remote`.
[[d1_databases]]
binding = "DB"
database_name = "brunen-chatbot"
database_id = "9d7c66b0-679b-47d3-8d38-a0223b3eab63"
migrations_dir = "migrations"
