# Worker del panel de administración (D32). El bot de WhatsApp tiene su propia configuración en wrangler.toml.
# Despliegue: `npm run deploy:panel`. Desarrollo local: `npm run dev:panel`.
#
# La administración (/admin) NO funciona sin Cloudflare Access: muestra datos personales y falla cerrado (503)
# mientras ACCESS_TEAM_DOMAIN y ACCESS_AUD estén vacíos. Además, nadie entra sin el secreto PANEL_SECRETO (D51), que se
# carga con `wrangler secret put PANEL_SECRETO -c wrangler.panel.toml` y nunca se escribe aquí.
# Pasos en docs/ETAPAS.md (sección "Plataforma de administración y reparto").
name = "brunen-panel"
main = "src/panel/index.ts"
compatibility_date = "2026-09-01"
# Sin direcciones de versión (`<versión>-brunen-panel.<subdominio>.workers.dev`): Access protege /admin en la dirección
# del panel y esas otras quedarían fuera de su aplicación (https://developers.cloudflare.com/workers/configuration/previews/).
preview_urls = false

[vars]
# Se llenan al activar Access (no son secretos): el dominio del equipo de Zero Trust y el "AUD tag" de la aplicación.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# D56, opción 1: esta es la dirección pública (portada y repartidor). Con la dirección de la administración aquí
# (https://brunen-admin.<subdominio>.workers.dev), /admin manda allá y esta dirección nunca sirve datos de administración.
PANEL_ADMIN_URL = ""
# Opcional, segunda barrera con los correos autorizados (PANEL_CORREOS, separados por coma): se carga con
# `wrangler secret put PANEL_CORREOS -c wrangler.panel.toml`, no aquí. Son correos de personas y este repositorio es público.

[assets]
directory = "./panel"
binding = "ASSETS"
# El Worker corre primero para comprobar el acceso antes de servir cualquier archivo.
run_worker_first = true

# La misma base D1 del bot. Las migraciones se aplican desde el Worker del bot (wrangler.toml).
[[d1_databases]]
binding = "DB"
database_name = "brunen-chatbot"
database_id = "9d7c66b0-679b-47d3-8d38-a0223b3eab63"

[observability]
enabled = true

# D56, opción 1: la administración en su propia dirección (brunen-admin.<subdominio>.workers.dev), entera detrás de
# Cloudflare Access: `npm run deploy:panel-admin`. Mismo código y misma base; las variables y la base no se heredan.
[env.admin]
name = "brunen-admin"
preview_urls = false

[env.admin.vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
PANEL_ADMIN_URL = ""

[[env.admin.d1_databases]]
binding = "DB"
database_name = "brunen-chatbot"
database_id = "9d7c66b0-679b-47d3-8d38-a0223b3eab63"
