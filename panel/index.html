<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b6cb0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brunen">
  <title>Brunen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/iconos/icono-192.png">
  <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body class="portada">
  <main id="portada" class="portada-contenido" hidden>
    <img class="portada-logo" src="/iconos/icono-192.png" alt="" width="72" height="72">
    <h1 class="portada-marca">Brunen</h1>
    <p class="portada-lema">Pedidos y reparto, en un solo lugar.</p>
    <nav class="entradas" aria-label="Elige cómo entrar">
      <a class="entrada entrada-admin" href="/admin/">
        <span class="entrada-titulo">Administrador</span>
        <span class="entrada-detalle">Pedidos, clientes, ruta y avisos</span>
      </a>
      <a class="entrada entrada-reparto" href="/repartidor/">
        <span class="entrada-titulo">Repartidor</span>
        <span class="entrada-detalle">La ruta de hoy</span>
      </a>
    </nav>
  </main>
  <noscript><p class="sin-js">Brunen necesita JavaScript para funcionar.</p></noscript>
  <script src="/portada.js" type="module"></script>
</body>
</html>
